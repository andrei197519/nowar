<style>
/* Базовая раскладка страницы */
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  overflow:hidden;
}
body{
  /* Фон: затемнение + полноэкранная картинка */
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url('https://in-driver.ru/og.jpg') center/cover no-repeat fixed;
}

/* ===== TIMER ===== */
/* Контейнер блока таймера */
.timer-wrap{
  text-align:center;
  margin:32px auto 16px;
}
/* Заголовок таймера с эффектом "крови" */
.timer-title{
  font-size:clamp(16px,4vw,26px);
  font-weight:900;
  letter-spacing:.05em;
  color:#ff0000;
  text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,0,0,.95);
  animation:bleed 2.5s infinite;
}
/* Сетка карточек дней/часов/минут/секунд */
.timer{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
/* Карточка одного значения */
.t{
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:12px;
  min-width:90px;
}
/* Число внутри карточки */
.t b{
  display:block;
  font-size:clamp(22px,5vw,40px);
  color:#ff2b2b;
  text-shadow:0 0 14px rgba(255,0,0,.9);
  animation:bleed 2.5s infinite;
}
/* Подпись единицы измерения */
.t span{
  font-size:12px;
  opacity:.85;
}

/* ===== BANNER ===== */
/* Блок потерь: заголовок + флаги + значения */
.losses{
  max-width:900px;
  width:100%;
  margin:0 auto 16px;
  text-align:center;
  padding:0 12px;
}
.losses-title{
  font-size:clamp(36px,9vw,90px);
  font-weight:900;
  color:#ff0000;
  text-shadow:0 0 22px rgba(255,0,0,.95);
  text-transform:uppercase;
}
.flags{
  margin:10px auto 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  max-width:600px;
}
.flag{
  width:180px;
  height:48px;
  border-radius:0;
  box-shadow:0 0 10px rgba(0,0,0,.35);
}
.flag.ukr{
  background:linear-gradient(#0057b7 0 50%, #ffd700 50% 100%);
}
.flag.rus{
  background:linear-gradient(#ffffff 0 33.33%, #1c57a7 33.33% 66.66%, #d52b1e 66.66% 100%);
}
.losses-values{
  margin:8px auto 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  max-width:600px;
}
.losses-value{
  width:180px;
  text-align:center;
  font-size:clamp(22px,5vw,40px);
  font-weight:900;
  color:#ff2b2b;
  text-shadow:0 0 14px rgba(255,0,0,.9);
  animation:bleed 2.5s infinite;
  line-height:1.1;
}
/* Внешний контейнер баннера */
.wrap{
  min-height:calc(100vh - 240px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}
/* Полупрозрачная панель с текстом и кнопками */
.panel{
  max-width:900px;
  width:100%;
  background:rgba(0,0,0,.42);
  border-radius:16px;
  padding:18px;
  text-align:center;
}
/* Главный заголовок страницы */
h1{
  margin:0 0 10px;
  font-size:clamp(36px,9vw,90px);
  color:#ff0000;
  text-shadow:0 0 22px rgba(255,0,0,.95);
}

/* Цветовые акценты, совпадающие с флагом Украины */
.blue{color:#0057b7;font-weight:900}
.yellow{color:#ffd700;font-weight:900}
.red{color:#ff2b2b}

/* Текстовые строки лозунгов */
p{
  margin:6px 0;
  font-size:clamp(16px,4.5vw,28px);
}

/* Разделитель между блоками текста */
hr{
  border:none;
  border-top:1px solid rgba(255,255,255,.45);
  margin:14px auto;
  width:70%;
}

/* ===== SOCIAL ===== */
/* Контейнер с иконками шеринга */
.social{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
/* Общие стили кнопок */
.social a{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  text-decoration:none;
  font-weight:900;
}
/* Цвета фирменных площадок */
.fb{background:#1877f2}
.tw{background:#000}
.vk{background:#4c75a3}
.wa{background:#25d366}
.sig{background:#3a76f0}
.rd{background:#ff4500}
.mail{background:#ffb400}

/* ===== BLOOD SNOW ===== */
/* Слой с "кровавым снегом" поверх всей страницы */
.snow{
  position:fixed;
  inset:0;
  pointer-events:none;
}
/* Одна "капля" анимации */
.drop{
  position:absolute;
  top:-20px;
  width:6px;
  height:6px;
  background:#b00000;
  border-radius:50%;
  box-shadow:0 0 8px rgba(255,0,0,.7);
  animation:fall linear;
}
/* Падение капель вниз за пределы экрана */
@keyframes fall{
  to{transform:translateY(120vh)}
}

/* ===== AUTHOR ===== */
/* Подпись автора/источника фото внизу */
.author{
  position:fixed;
  bottom:8px;
  right:12px;
  font-size:12px;
  white-space:nowrap;
  animation:marquee 18s linear infinite;
}

/* Бегущая строка */
@keyframes marquee{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ===== ANIM ===== */
/* Легкое "кровотечение" для заголовка и цифр */
@keyframes bleed{
  0%,100%{filter:blur(0)}
  50%{filter:blur(1.2px)}
}

/* Мобильные правки */
@media(max-width:480px){
  .losses{margin:0 auto 12px}
  .flags,.losses-values{max-width:320px;gap:12px}
  .flag{width:100px;height:32px}
  .losses-value{width:100px}
  .panel{padding:14px}
  .social a{width:38px;height:38px}
}
</style>

<body>

<!-- Контейнер для анимированных капель -->
<div class="snow" id="snow"></div>

<!-- Таймер длительности войны -->

<!-- Основной текстовый блок -->
<div class="wrap">

    <div class="social">

    </div>
  </div>
</div>

<!-- Подпись источника фотографии -->
<div class="author">
  <span class="yellow">Borodianka, Kyiv Oblast, 6 April.</span>
  <span class="blue"> Photo: Oleksandr Ratushniak / UNDP Ukraine</span>
</div>

<script>
/* ===== TIMER (UTC-корректный) ===== */
// Время начала войны в UTC. Используем Date.parse, чтобы избежать локальных смещений.
const start = Date.parse('2022-02-24T03:00:00Z'); // начало войны (UTC)
const timer = document.getElementById('timer');

// Пересчитывает разницу времени и обновляет DOM.
function tick(){
  const diff = Math.floor((Date.now() - start) / 1000);

  const days = Math.floor(diff / 86400);
  const hours = Math.floor((diff % 86400) / 3600);
  const minutes = Math.floor((diff % 3600) / 60);
  const seconds = diff % 60;

  // Шаблон для четырех карточек таймера.
  timer.innerHTML = `
    <div class="t"><b>${days}</b><span>ДНЕЙ</span></div>
    <div class="t"><b>${hours}</b><span>ЧАСОВ</span></div>
    <div class="t"><b>${minutes}</b><span>МИН</span></div>
    <div class="t"><b>${seconds}</b><span>СЕК</span></div>
  `;
}
// Первый рендер и последующие обновления раз в секунду.
tick();
setInterval(tick,1000);

/* ===== BLOOD SNOW ===== */
// Создаем "капли" и удаляем их после пролета.
const snow = document.getElementById('snow');
setInterval(()=>{
  // 4 капли за цикл: делает снег плотнее, но без перегруза.
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='drop';
    d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(Math.random()*5+6)+'s';
    snow.appendChild(d);
    setTimeout(()=>d.remove(),12000);
  }
},300);
</script>
