<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>STOP THE WAR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Open Graph: превью для соцсетей и мессенджеров -->
<meta property="og:type" content="website">
<meta property="og:title" content="STOP THE WAR">
<meta property="og:description" content="NO TO WAR. FREEDOM FOR UKRAINE. НЕТ ВОЙНЕ. END THE WAR NOW.">
<meta property="og:url" content="https://in-driver.ru/">
<meta property="og:image" content="https://in-driver.ru/og.jpg">
<meta property="og:image:secure_url" content="https://in-driver.ru/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="800">
<meta property="og:image:alt" content="STOP THE WAR. НЕТ ВОЙНЕ.">

<meta name="twitter:card" content="summary_large_image">

<style>
/* Базовая раскладка страницы */
html,body{
  margin:0;
  height:100%;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  overflow-x:hidden;
}
body{
  /* Фон: затемнение + полноэкранная картинка */
  --bg-image:url('https://in-driver.ru/og.jpg');
  background:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    var(--bg-image) center/cover no-repeat fixed;
}

/* Центральная колонка контента */
.layout{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(10px,2.5vh,20px);
  padding:clamp(24px,5vh,48px) 12px 56px;
  box-sizing:border-box;
}

/* ===== TIMER ===== */
/* Контейнер блока таймера */
.timer-wrap{
  text-align:center;
  margin:0;
}
/* Заголовок таймера с эффектом "крови" */
.timer-title{
  font-size:clamp(16px,4vw,26px);
  font-weight:900;
  letter-spacing:.05em;
  color:#ff0000;
  text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,0,0,.95);
  animation:bleed 2.5s infinite;
}
/* Сетка карточек дней/часов/минут/секунд */
.timer{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
}
/* Карточка одного значения */
.t{
  background:rgba(0,0,0,.55);
  padding:10px 14px;
  border-radius:12px;
  min-width:90px;
}
/* Число внутри карточки */
.t b{
  display:block;
  font-size:clamp(22px,5vw,40px);
  color:#ff2b2b;
  text-shadow:0 0 14px rgba(255,0,0,.9);
  animation:bleed 2.5s infinite;
}
/* Подпись единицы измерения */
.t span{
  font-size:12px;
  opacity:.85;
}

/* ===== BANNER ===== */
/* Блок потерь: заголовок + флаги + значения */
.losses{
  max-width:900px;
  width:100%;
  margin:0 auto;
  text-align:center;
  padding:0 12px;
}
.losses-title{
  font-size:clamp(36px,9vw,90px);
  font-weight:900;
  color:#ff0000;
  text-shadow:0 0 22px rgba(255,0,0,.95);
  text-transform:uppercase;
}
.flags{
  margin:10px auto 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
  max-width:600px;
}
.flag{
  width:180px;
  height:48px;
  border-radius:0;
  box-shadow:0 0 10px rgba(0,0,0,.35);
}
.flag.ukr{
  background:linear-gradient(#0057b7 0 50%, #ffd700 50% 100%);
}
.flag.rus{
  background:linear-gradient(#ffffff 0 33.33%, #1c57a7 33.33% 66.66%, #d52b1e 66.66% 100%);
}
.losses-values{
  margin:8px auto 0;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  max-width:600px;
}
.losses-value{
  width:180px;
  text-align:center;
  font-size:clamp(22px,5vw,40px);
  font-weight:900;
  color:#ff2b2b;
  text-shadow:0 0 14px rgba(255,0,0,.9);
  animation:bleed 2.5s infinite;
  line-height:1.1;
}
/* Плеер фоновой музыки */
.player{
  width:clamp(220px,30vw,320px);
  height:32px;
  opacity:.85;
  filter:drop-shadow(0 0 12px rgba(255,0,0,.35));
}
.player::-webkit-media-controls-panel{
  background:rgba(0,0,0,.55);
  border-radius:999px;
}
.player::-webkit-media-controls-play-button,
.player::-webkit-media-controls-mute-button{
  filter:invert(1);
}
.player::-webkit-media-controls-current-time-display,
.player::-webkit-media-controls-time-remaining-display{
  color:#ff2b2b;
  text-shadow:0 0 8px rgba(255,0,0,.6);
}
.player::-webkit-media-controls-timeline{
  filter:hue-rotate(-20deg) saturate(1.4);
}
/* Внешний контейнер баннера */
.wrap{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
/* Полупрозрачная панель с текстом и кнопками */
.panel{
  max-width:900px;
  width:100%;
  background:rgba(0,0,0,.42);
  border-radius:16px;
  padding:clamp(14px,2.5vw,20px);
  text-align:center;
}
/* Вид баннера после смены фона */
body.after-swap .panel{
  max-width:720px;
  padding:clamp(12px,2vw,16px);
  border-radius:14px;
}
body.after-swap h1{
  font-size:clamp(28px,7vw,70px);
}
/* Главный заголовок страницы */
h1{
  margin:0 0 10px;
  font-size:clamp(36px,9vw,90px);
  color:#ff0000;
  text-shadow:0 0 22px rgba(255,0,0,.95);
}

/* Цветовые акценты, совпадающие с флагом Украины */
.blue{color:#0057b7;font-weight:900}
.yellow{color:#ffd700;font-weight:900}
.red{color:#ff2b2b}
/* Красная надпись после смены фона */
.swap-message{
  margin-top:8px;
  font-size:clamp(18px,5vw,34px);
  font-weight:900;
  color:#ff2b2b;
  text-shadow:0 0 18px rgba(255,0,0,.9);
  animation:bleed 2.5s infinite;
  display:none;
}
body.after-swap .swap-message{
  display:block;
}

/* Текстовые строки лозунгов */
p{
  margin:6px 0;
  font-size:clamp(16px,4.5vw,28px);
}

/* Разделитель между блоками текста */
hr{
  border:none;
  border-top:1px solid rgba(255,255,255,.45);
  margin:14px auto;
  width:70%;
}

/* ===== SOCIAL ===== */
/* Контейнер с иконками шеринга */
.social{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
/* Общие стили кнопок */
.social a{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  color:#fff;
  text-decoration:none;
  font-weight:900;
}
/* Цвета фирменных площадок */
.fb{background:#1877f2}
.tw{background:#000}
.vk{background:#4c75a3}
.wa{background:#25d366}
.sig{background:#3a76f0}
.rd{background:#ff4500}
.mail{background:#ffb400}

/* ===== BLOOD SNOW ===== */
/* Слой с "кровавым снегом" поверх всей страницы */
.snow{
  position:fixed;
  inset:0;
  pointer-events:none;
}
/* Одна "капля" анимации */
.drop{
  position:absolute;
  top:-20px;
  width:6px;
  height:6px;
  background:#b00000;
  border-radius:50%;
  box-shadow:0 0 8px rgba(255,0,0,.7);
  animation:fall linear;
}
/* Падение капель вниз за пределы экрана */
@keyframes fall{
  to{transform:translateY(120vh)}
}

/* ===== AUTHOR ===== */
/* Подпись автора/источника фото внизу */
.author{
  position:fixed;
  bottom:8px;
  right:12px;
  font-size:12px;
  white-space:nowrap;
  animation:marquee 18s linear infinite;
}

/* Бегущая строка */
@keyframes marquee{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* ===== ANIM ===== */
/* Легкое "кровотечение" для заголовка и цифр */
@keyframes bleed{
  0%,100%{filter:blur(0)}
  50%{filter:blur(1.2px)}
}

/* Мобильные правки */
@media(max-width:480px){
  .layout{padding:24px 12px 48px}
  .flags,.losses-values{max-width:320px;gap:12px}
  .flag{width:100px;height:32px}
  .losses-value{width:100px}
  .player{width:220px;height:30px}
  .social a{width:38px;height:38px}
}
</style>
</head>

<body>

<!-- Контейнер для анимированных капель -->
<div class="snow" id="snow"></div>

<div class="layout">
  <!-- Фоновая музыка (управление на экране) -->
  <audio class="player" src="Music/Война.mp3" autoplay loop controls></audio>
<!-- Таймер длительности войны -->
<div class="timer-wrap">
  <div class="timer-title">
    ВОЙНА, КОТОРУЮ РАЗВЯЗАЛ ЛИЧНО ПУТИН, ПРОДОЛЖАЕТСЯ:
  </div>
  <div class="timer" id="timer"></div>
</div>

<!-- Блок потерь -->
<div class="losses">
  <div class="losses-title">ПОТЕРИ</div>
  <div class="flags" aria-hidden="true">
    <div class="flag ukr"></div>
    <div class="flag rus"></div>
  </div>
  <div class="losses-values">
    <div class="losses-value">400&nbsp;т.<br>человек</div>
    <div class="losses-value">1&nbsp;млн.<br>человек</div>
  </div>
</div>

<!-- Основной текстовый блок -->
<div class="wrap">
  <div class="panel">
    <h1>STOP THE WAR</h1>
    <p class="blue">НЕТ ВОЙНЕ!</p>
    <p class="yellow">FREEDOM FOR UKRAINE</p>
    <hr>
    <p class="blue">PUTIN IS A WAR CRIMINAL</p>
    <p class="red">END THE WAR NOW</p>
    <p class="swap-message">Миру быть. Остановите войну.</p>

    <!-- Кнопки шеринга в соцсетях -->
    <div class="social">
      <a class="fb" data-share="fb" href="#" target="_blank" rel="noopener">f</a>
      <a class="tw" data-share="tw" href="#" target="_blank" rel="noopener">X</a>
      <a class="vk" data-share="vk" href="#" target="_blank" rel="noopener">vk</a>
      <a class="wa" data-share="wa" href="#" target="_blank" rel="noopener">wa</a>
      <a class="sig" data-share="sig" href="#" target="_blank" rel="noopener">S</a>
      <a class="rd" data-share="rd" href="#" target="_blank" rel="noopener">r</a>
      <a class="mail" data-share="mail" href="#">@</a>
    </div>
  </div>
</div>
</div>

<!-- Подпись источника фотографии -->
<div class="author" id="author"></div>

<script>
/* ===== TIMER (UTC-корректный) ===== */
// Время начала войны в UTC. Используем Date.parse, чтобы избежать локальных смещений.
const start = Date.parse('2022-02-24T03:00:00Z'); // начало войны (UTC)
const timer = document.getElementById('timer');

// Пересчитывает разницу времени и обновляет DOM.
function tick(){
  const diff = Math.floor((Date.now() - start) / 1000);

  const days = Math.floor(diff / 86400);
  const hours = Math.floor((diff % 86400) / 3600);
  const minutes = Math.floor((diff % 3600) / 60);
  const seconds = diff % 60;

  // Шаблон для четырех карточек таймера.
  timer.innerHTML = `
    <div class="t"><b>${days}</b><span>ДНЕЙ</span></div>
    <div class="t"><b>${hours}</b><span>ЧАСОВ</span></div>
    <div class="t"><b>${minutes}</b><span>МИН</span></div>
    <div class="t"><b>${seconds}</b><span>СЕК</span></div>
  `;
}
// Первый рендер и последующие обновления раз в секунду.
tick();
setInterval(tick,1000);

/* ===== PHOTO ROTATION ===== */
const author = document.getElementById('author');
const photoEndpoint = 'photos.php';
const swapDelay = 10000;
let photos = [];
let currentIndex = 0;
let rotationTimer = null;

function setAuthorText(text){
  const clean = (text || '').trim();
  author.textContent = clean;
  author.style.display = clean ? 'block' : 'none';
}

function setShareLinks(file){
  const shareUrl = `${location.origin}/share.php?photo=${encodeURIComponent(file)}`;
  const encoded = encodeURIComponent(shareUrl);
  const mailSubject = encodeURIComponent('STOP THE WAR');
  const mailTo = `mailto:nowar@putinpidoras.shop?subject=${mailSubject}&body=${encoded}`;
  const map = {
    fb: `https://www.facebook.com/sharer/sharer.php?u=${encoded}`,
    tw: `https://twitter.com/intent/tweet?url=${encoded}`,
    vk: `https://vk.com/share.php?url=${encoded}`,
    wa: `https://wa.me/?text=${encoded}`,
    sig: `https://signal.me/#/?text=${encoded}`,
    rd: `https://www.reddit.com/submit?url=${encoded}`,
    mail: mailTo
  };

  document.querySelectorAll('.social a[data-share]').forEach((link)=>{
    const key = link.getAttribute('data-share');
    if (map[key]) {
      link.href = map[key];
    }
  });
}

function applyPhoto(photo){
  const encoded = encodeURIComponent(photo.file);
  const url = `Photo/${encoded}`;
  document.body.style.setProperty('--bg-image', `url('${url}')`);
  const fallback = photo.file.replace(/\.[^/.]+$/, '');
  setAuthorText(photo.comment || fallback);
  setShareLinks(photo.file);
}

function startRotation(){
  if (!photos.length) return;
  document.body.classList.add('after-swap');
  currentIndex = (currentIndex + 1) % photos.length;
  applyPhoto(photos[currentIndex]);
  if (rotationTimer) clearInterval(rotationTimer);
  rotationTimer = setInterval(()=>{
    currentIndex = (currentIndex + 1) % photos.length;
    applyPhoto(photos[currentIndex]);
  }, swapDelay);
}

fetch(photoEndpoint)
  .then((res)=>res.json())
  .then((data)=>{
    photos = Array.isArray(data.photos) ? data.photos : [];
    if (!photos.length) return;

    const params = new URLSearchParams(location.search);
    const requested = params.get('photo');
    const requestedIndex = photos.findIndex((p)=>p.file === requested);
    currentIndex = requestedIndex >= 0 ? requestedIndex : 0;

    applyPhoto(photos[currentIndex]);
    setTimeout(startRotation, swapDelay);
  })
  .catch(()=>{});

/* ===== BLOOD SNOW ===== */
// Создаем "капли" и удаляем их после пролета.
const snow = document.getElementById('snow');
setInterval(()=>{
  // 4 капли за цикл: делает снег плотнее, но без перегруза.
  for(let i=0;i<4;i++){
    const d=document.createElement('div');
    d.className='drop';
    d.style.left=Math.random()*100+'vw';
    d.style.animationDuration=(Math.random()*5+6)+'s';
    snow.appendChild(d);
    setTimeout(()=>d.remove(),12000);
  }
},300);
</script>
<!-- staging test: 2025-01-XX -->
</body>
</html>
